<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyre Analytics - YouTube Influencer Analytics</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Zephyre Analytics</h1>
      <p>Search a YouTube channel to get analytics and estimated earnings</p>
      <input
        type="text"
        id="searchInput"
        placeholder="Enter YouTube channel name"
      />
      <button id="searchBtn">Search</button>

      <!-- Analytics Card -->
      <div id="channelCard" class="card hidden">
        <div class="channel-info">
          <img id="channelImg" src="" alt="Channel Image" class="channel-img" />
          <div>
            <h2 id="channelName"></h2>
            <p id="channelDesc"></p>
          </div>
        </div>
        <div class="stats">
          <p><strong>Subscribers:</strong> <span id="subsCount">0</span></p>
          <p><strong>Total Views:</strong> <span id="viewsCount">0</span></p>
          <p><strong>Videos:</strong> <span id="videosCount">0</span></p>
          <p>
            <strong>Average Views per Video:</strong>
            <span id="avgViews">0</span>
          </p>
          <p>
            <strong>Engagement Rate:</strong>
            <span id="engagementScore">0%</span>
          </p>
        </div>
        <!-- Earnings Section -->
        <div class="earnings">
          <h3>Estimated Monthly Earnings</h3>
          <p id="earnings" class="earnings-value">Loading...</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
